<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Pulse - Instant URL Auditor</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 650px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; }
        h1 { color: #2c3e50; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-top: 20px; }
        input[type="url"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #93c5fd; }
        .error { margin-top: 20px; padding: 12px; background: #fee2e2; color: #dc2626; border-radius: 6px; display: none; }
        .report { margin-top: 20px; display: none; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; }
        .metric { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #edf2f7; }
        .metric:last-child { border-bottom: none; }
        .label { font-weight: 600; color: #475569; }
        .value { color: #0f172a; word-break: break-all; }
        footer { text-align: center; margin-top: 40px; font-size: 14px; color: #64748b; }
        footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Page Pulse</h1>
        <p>Audit any webpage instantly for performance and SEO metrics.</p>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://example.com" required>
            <button id="auditBtn" onclick="runAudit()">Audit URL</button>
        </div>

        <div id="errorBox" class="error"></div>

        <div id="reportBox" class="report">
            <h3>Audit Report</h3>
            <div class="metric"><span class="label">HTTP Status:</span><span class="value" id="resStatus"></span></div>
            <div class="metric"><span class="label">Response Time:</span><span class="value" id="resTime"></span></div>
            <div class="metric"><span class="label">Page Title:</span><span class="value" id="resTitle"></span></div>
            <div class="metric"><span class="label">Meta Description:</span><span class="value" id="resMeta"></span></div>
            <div class="metric"><span class="label">H1 Tag Count:</span><span class="value" id="resH1"></span></div>
            <div class="metric"><span class="label">Images Missing Alt:</span><span class="value" id="resAlt"></span></div>
            <div class="metric"><span class="label">Word Count:</span><span class="value" id="resWords"></span></div>
        </div>
    </div>

    <footer>
        Built for Digital Heroes Training Task, linked to <a href="https://digitalheroesco.com" target="_blank">digitalheroesco.com</a>
    </footer>

    <script>
        async function runAudit() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('auditBtn');
            const errorBox = document.getElementById('errorBox');
            const reportBox = document.getElementById('reportBox');

            errorBox.style.display = 'none';
            reportBox.style.display = 'none';

            if (!urlInput) {
                errorBox.innerText = 'Please enter a valid URL.';
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Auditing...';

            try {
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to complete audit.');
                }

                document.getElementById('resStatus').innerText = data.httpStatus;
                document.getElementById('resTime').innerText = data.responseTimeMs;
                document.getElementById('resTitle').innerText = data.pageTitle;
                document.getElementById('resMeta').innerText = data.metaDescription;
                document.getElementById('resH1').innerText = data.h1Count;
                document.getElementById('resAlt').innerText = data.imagesMissingAlt;
                document.getElementById('resWords').innerText = data.approximateWordCount;

                reportBox.style.display = 'block';

            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Audit URL';
            }
        }
    </script>
</body>
</html>
